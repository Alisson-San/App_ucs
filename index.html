<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Universidade de Caxias do Sul</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="login-body">

    <div class="mobile-frame login-frame">
        
        <div class="ucs-topbar">
            <div class="topbar-left">
                <span class="material-symbols-outlined">language</span>
                <span data-i18n="topbar_title">Universidade de Caxias do Sul</span>
            </div>
            <span class="material-symbols-outlined menu-icon">menu</span>
        </div>

        <div class="login-content-area">
            <main class="card login-card-original">
                
                <div class="logo-container">
                    <img src="imagens/logo-ucs.png" alt="UCS" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="logo-fallback-red"><span>UCS</span></div>
                </div>

                <form id="loginForm">
                    <div class="input-with-icon">
                        <span class="material-symbols-outlined icon-left">person</span>
                        <input type="text" id="user" data-i18n-placeholder="user_ph" placeholder="Usuário" required>
                    </div>
                    
                    <div class="input-with-icon">
                        <span class="material-symbols-outlined icon-left">lock</span>
                        <input type="password" id="password" data-i18n-placeholder="pass_ph" placeholder="Senha" required>
                        <button type="button" class="toggle-password-btn" id="toggleBtn">
                            <span class="material-symbols-outlined">visibility_off</span>
                        </button>
                    </div>

                    <div class="checkbox-container">
                        <input type="checkbox" id="lembrar" class="custom-checkbox">
                        <label for="lembrar" data-i18n="remember">Lembrar meu usuário</label>
                    </div>

                    <button type="submit" class="btn-ucs-blue" id="submitBtn" data-i18n="login_btn">ENTRAR</button>
                </form>

                <div class="login-links-vertical">
                    
                    <a href="#" data-i18n="first_access">Políticas de Privacidade</a>
                </div>

                <div class="language-selector">
                    <button class="lang-btn active" type="button" data-lang="pt">
                        <span class="fi fi-br"></span> PT-BR
                    </button>
                    <button class="lang-btn" type="button" data-lang="en">
                        <span class="fi fi-us"></span> EN-US
                    </button>
                </div>

            </main>
        </div>
    </div>

    <script src="Javascript/app.js"></script>
</body>
</html>
