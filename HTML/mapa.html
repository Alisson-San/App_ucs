<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa do Campus - App Acadêmico</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../CSS/style.css">

</head>
<body>

    <div class="mobile-frame" style="padding: 0; display: flex; flex-direction: column;">
        
        <div class="topbar-subpage">
            <a href="../HTML/home.html" class="back-button">
                <span class="material-symbols-outlined">arrow_back_ios_new</span>
            </a>
            <h2>Mapa do Campus</h2>
            <span class="material-symbols-outlined" style="visibility: hidden;">arrow_back_ios_new</span>
        </div>

        <div class="map-campus-panel">
            <div class="campus-selector map-campus-selector">
                <button class="campus-btn active" type="button" data-map-src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3527.4481472442803!2d-51.14964603087218!3d-29.161345531709248!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1spt-BR!2sbr!4v1783089846345!5m2!1spt-BR!2sbr">Caxias do Sul</button>
                <button class="campus-btn" type="button" data-map-src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2159.2013913436585!2d-51.52119061056744!3d-29.146661667316447!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1spt-BR!2sbr!4v1783089670119!5m2!1spt-BR!2sbr">Bento Gonçalves</button>
            </div>
        </div>

        <div class="map-area" id="mapContainer">
            <iframe
                class="map-iframe"
                id="mapFrame"
                title="Mapa do Campus UCS Caxias do Sul"
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3527.4481472442803!2d-51.14964603087218!3d-29.161345531709248!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1spt-BR!2sbr!4v1783089846345!5m2!1spt-BR!2sbr"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>

    </div>

    <script src="../Javascript/app.js"></script>

</body>
</html>
